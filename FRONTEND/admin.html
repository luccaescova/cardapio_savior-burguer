<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Savior Burguer — Admin Impressora</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Barlow Condensed', sans-serif; }
    body { background: #121212; color: #fff; padding: 20px; }
    .admin-container { max-width: 800px; margin: 0 auto; }
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 30px; border-bottom: 2px solid #333; padding-bottom: 15px; }
    h1 { color: #ff8c00; letter-spacing: 1px; }
    .card { background: #1e1e1e; border: 1px solid #333; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
    h2 { margin-bottom: 10px; font-size: 1.5rem; color: #ff8c00; }
    p { color: #aaa; margin-bottom: 15px; font-size: 1.1rem; }
    .form-group { display: flex; gap: 10px; }
    select { flex: 1; padding: 12px; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 5px; font-size: 1.1rem; }
    button { padding: 12px 24px; background: #ff8c00; color: #fff; border: none; border-radius: 5px; font-weight: bold; font-size: 1.1rem; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #e07b00; }
    .status-msg { margin-top: 15px; font-weight: bold; font-size: 1.1rem; }
  </style>
</head>
<body>
  <div class="admin-container">
    <header>
      <h1>SAVIOR BURGUER — ADMIN</h1>
      <a href="index.html" style="color: #ff8c00; text-decoration: none; font-weight: bold;">← Ver Cardápio</a>
    </header>

    <main>
      <section class="card">
        <h2>⚙️ Configurar Impressora Térmica USB</h2>
        <p>Selecione abaixo a impressora reconhecida pelo Windows:</p>

        <div class="form-group">
          <select id="printerSelect">
            <option value="">A carregar impressoras...</option>
          </select>
          <button id="btnSavePrinter">Salvar Impressora</button>
        </div>

        <div id="printerStatus" class="status-msg"></div>
      </section>
    </main>
  </div>

  <script src="admin.js"></script>
</body>
</html>
