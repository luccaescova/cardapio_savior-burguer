<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Savior Burguer — Painel Admin & Cozinha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Barlow Condensed', sans-serif; }
    body { background: #121212; color: #fff; padding: 20px; }
    .admin-container { max-width: 1200px; margin: 0 auto; }
    
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 25px; border-bottom: 2px solid #333; padding-bottom: 15px; }
    h1 { color: #ff8c00; letter-spacing: 1px; font-size: 2.2rem; }
    .header-links a { color: #00f5d4; text-decoration: none; font-weight: bold; font-size: 1.2rem; margin-left: 15px; }

    .grid-configs { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px; margin-bottom: 25px; }
    .card { background: #1e1e1e; border: 1px solid #333; border-radius: 8px; padding: 20px; }
    h2 { margin-bottom: 15px; font-size: 1.5rem; color: #ff8c00; text-transform: uppercase; }
    p { color: #aaa; margin-bottom: 15px; font-size: 1.05rem; }

    .form-group { display: flex; gap: 10px; }
    select { flex: 1; padding: 12px; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 5px; font-size: 1.1rem; }
    button { padding: 12px 20px; background: #ff8c00; color: #fff; border: none; border-radius: 5px; font-weight: bold; font-size: 1.1rem; cursor: pointer; transition: 0.2s; }
    button:hover { background: #e07b00; }
    
    .btn-danger { background-color: #ff4757; color: white; width: 100%; margin-top: 10px; }
    .btn-danger:hover { background-color: #e03543; }

    .status-msg { margin-top: 15px; font-weight: bold; font-size: 1.1rem; display: flex; align-items: center; gap: 10px; }

    /* Spinner Animado */
    .spinner {
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 140, 0, 0.3);
      border-radius: 50%;
      border-top-color: #ff8c00;
      animation: spin 0.8s linear infinite;
      display: inline-block;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .qr-container { text-align: center; margin-top: 15px; }
    .qr-container img { max-width: 220px; border: 4px solid #fff; border-radius: 8px; background: #fff; }

    .orders-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 15px; }
    .order-card { background: #242424; border-radius: 8px; padding: 18px; border-left: 5px solid #ffb703; }
    .order-card.ready { border-left-color: #00f5d4; }
    .order-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid #333; padding-bottom: 8px; }
    .order-title { font-size: 1.4rem; font-weight: bold; }
    .status-badge { padding: 3px 8px; border-radius: 4px; font-size: 0.9rem; font-weight: bold; text-transform: uppercase; }
    .badge-preparando { background: #ffb703; color: #000; }
    .badge-pronto { background: #00f5d4; color: #000; }
    .items-list { background: #181818; padding: 10px; border-radius: 6px; margin-bottom: 12px; max-height: 160px; overflow-y: auto; }
    .btn-group { display: flex; gap: 8px; }
    .btn-action { flex: 1; padding: 10px; border: none; border-radius: 5px; font-size: 1rem; font-weight: bold; cursor: pointer; }
    .btn-call { background: #00f5d4; color: #121212; }
    .btn-deliver { background: #ff4757; color: white; }
  </style>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <div class="admin-container">
    <header>
      <h1>SAVIOR BURGUER — PAINEL ADMIN</h1>
      <div class="header-links">
        <a href="/tv.html" target="_blank">📺 Ver Telão TV</a>
        <a href="/" target="_blank" style="color: #ff8c00;">🍔 Ver Cardápio</a>
      </div>
    </header>

    <main>
      <div class="grid-configs">
        <!-- Impressora -->
        <section class="card">
          <h2>⚙️ Impressora Térmica</h2>
          <p>Selecione a impressora configurada:</p>
          <div class="form-group">
            <select id="printerSelect">
              <option value="">A carregar impressoras...</option>
            </select>
            <button id="btnSavePrinter">Salvar</button>
          </div>
          <div id="printerStatus" class="status-msg"></div>
        </section>

        <!-- WhatsApp -->
        <section class="card">
          <h2>📱 CONEXÃO WHATSAPP</h2>
          <div id="waStatusMsg" class="status-msg" style="margin-top: 0;">
            <div class="spinner"></div> <span style="color: #ffb703;">A iniciar serviço do WhatsApp...</span>
          </div>
          <div id="qrContainer" class="qr-container" style="display: none;">
            <p style="color: #00f5d4; margin-bottom: 10px;">Escaneie o QR Code com o seu WhatsApp:</p>
            <img id="qrImage" src="" alt="QR Code WhatsApp" />
          </div>
          <div id="whatsappActionContainer" style="margin-top: 15px;"></div>
        </section>
      </div>

      <!-- Pedidos Cozinha -->
      <section class="card">
        <h2>👨‍🍳 Pedidos Ativos na Cozinha</h2>
        <div id="ordersGrid" class="orders-grid">
          <p style="grid-column: 1/-1; color: #aaa;">A carregar pedidos...</p>
        </div>
      </section>
    </main>
  </div>

  <script>
    // Usa o socket já existente do admin.js ou instancia caso não exista
    const adminSocket = typeof socket !== 'undefined' ? socket : io();

    const waStatusMsg = document.getElementById('waStatusMsg');
    const qrContainer = document.getElementById('qrContainer');
    const qrImage = document.getElementById('qrImage');
    const whatsappActionContainer = document.getElementById('whatsappActionContainer');

    function updateWhatsAppUI(status, qrSrc = null) {
      if (status === 'CONNECTED') {
        qrContainer.style.display = 'none';
        waStatusMsg.innerHTML = `<span style="color: #00f5d4; font-weight: bold;">✅ WhatsApp Conectado e Pronto!</span>`;
        whatsappActionContainer.innerHTML = `<button class="btn-danger" onclick="disconnectWhatsApp()">Desconectar WhatsApp</button>`;
      } else if (status === 'QR_READY' && qrSrc) {
        qrContainer.style.display = 'block';
        qrImage.src = qrSrc;
        waStatusMsg.innerHTML = `<span style="color: #ffb703;">⏳ Aguardando leitura do QR Code...</span>`;
        whatsappActionContainer.innerHTML = '';
      } else {
        qrContainer.style.display = 'none';
        waStatusMsg.innerHTML = `<div class="spinner"></div> <span style="color: #ffb703;">A inicializar / A gerar novo QR Code...</span>`;
        whatsappActionContainer.innerHTML = '';
      }
    }

    adminSocket.on('whatsapp_status', (data) => {
      updateWhatsAppUI(data.status);
    });

    adminSocket.on('whatsapp_qr', (qrCodeDataUrl) => {
      updateWhatsAppUI('QR_READY', qrCodeDataUrl);
    });

    fetch('/api/whatsapp/status')
      .then(res => res.json())
      .then(data => {
        updateWhatsAppUI(data.status, data.qrCode);
      })
      .catch(err => console.error('Erro ao buscar status do WhatsApp:', err));

    function disconnectWhatsApp() {
      if (confirm('Deseja realmente desconectar o WhatsApp e gerar um novo QR Code?')) {
        waStatusMsg.innerHTML = `<div class="spinner"></div> <span style="color: #ff4757;">A desconectar...</span>`;
        qrContainer.style.display = 'none';
        whatsappActionContainer.innerHTML = '';

        fetch('/api/whatsapp/disconnect', { method: 'POST' })
          .then(res => res.json())
          .then(data => {
            setTimeout(() => location.reload(), 1500);
          })
          .catch(err => {
            console.error('Erro ao desconectar:', err);
            alert('Erro ao tentar desconectar o WhatsApp.');
          });
      }
    }
  </script>
  <script src="admin.js"></script>
</body>
</html>
