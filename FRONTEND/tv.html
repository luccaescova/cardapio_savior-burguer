<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel TV - Savior Burguer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
    body { background-color: #121212; color: #ffffff; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
    header { background-color: #1e1e1e; padding: 20px; text-align: center; border-bottom: 3px solid #ff8c00; }
    header h1 { color: #ff8c00; font-size: 2.5rem; letter-spacing: 2px; text-transform: uppercase; }
    
    .main-container { display: flex; flex: 1; height: calc(100vh - 85px); }
    .column { flex: 1; padding: 20px; display: flex; flex-direction: column; }
    .column-preparing { background-color: #181818; border-right: 2px solid #2a2a2a; }
    .column-ready { background-color: #121212; }
    
    .column-title { font-size: 1.8rem; text-align: center; padding-bottom: 15px; margin-bottom: 20px; border-bottom: 2px solid #333; text-transform: uppercase; }
    .preparing-title { color: #ffb703; }
    .ready-title { color: #00f5d4; }
    
    .orders-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 15px; align-content: start; overflow-y: auto; }
    .order-card { background-color: #242424; border-radius: 12px; padding: 25px 20px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    .order-card.ready { border: 2px solid #00f5d4; background-color: #1a2e2b; }
    .order-customer { font-size: 1.8rem; font-weight: bold; color: #ffffff; word-break: break-word; }
    .order-card.ready .order-customer { color: #00f5d4; }

    /* Modal de Anúncio */
    .announcement-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: rgba(0,0,0,0.95); display: flex; justify-content: center; align-items: center; z-index: 9999; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
    .announcement-overlay.active { opacity: 1; pointer-events: auto; }
    .announcement-box { text-align: center; border: 4px solid #00f5d4; padding: 60px 100px; border-radius: 20px; background-color: #121212; box-shadow: 0 0 50px rgba(0, 245, 212, 0.4); }
    .announcement-title { font-size: 2.5rem; color: #ff8c00; margin-bottom: 20px; text-transform: uppercase; }
    .announcement-name { font-size: 5rem; font-weight: bold; color: #00f5d4; text-transform: uppercase; }
  </style>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

  <header>
    <h1>🍔 SAVIOR BURGUER 🍔</h1>
  </header>

  <div class="main-container">
    <div class="column column-preparing">
      <h2 class="column-title preparing-title">⏳ PREPARANDO</h2>
      <div id="preparingContainer" class="orders-grid"></div>
    </div>

    <div class="column column-ready">
      <h2 class="column-title ready-title">✅ PRONTO PARA RETIRAR</h2>
      <div id="readyContainer" class="orders-grid"></div>
    </div>
  </div>

  <div id="announcementModal" class="announcement-overlay">
    <div class="announcement-box">
      <div class="announcement-title">PEDIDO PRONTO!</div>
      <div id="announceName" class="announcement-name">NOME</div>
    </div>
  </div>

  <script>
    const socket = io();

    const preparingContainer = document.getElementById('preparingContainer');
    const readyContainer = document.getElementById('readyContainer');
    const announcementModal = document.getElementById('announcementModal');
    const announceName = document.getElementById('announceName');

    function speakOrder(customerName) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const text = `Pedido de ${customerName}, está pronto!`;
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'pt-BR';
        utterance.rate = 0.95;
        window.speechSynthesis.speak(utterance);
      }
    }

    function triggerAnnouncement(order) {
      announceName.textContent = order.customerName;
      announcementModal.classList.add('active');
      speakOrder(order.customerName);

      setTimeout(() => {
        announcementModal.classList.remove('active');
      }, 6000);
    }

    socket.on('orders_update', (orders) => {
      const preparingOrders = orders.filter(o => o.status === 'preparando');
      const readyOrders = orders.filter(o => o.status === 'pronto');

      preparingContainer.innerHTML = preparingOrders.map(o => `
        <div class="order-card">
          <div class="order-customer">${o.customerName}</div>
        </div>
      `).join('');

      readyContainer.innerHTML = readyOrders.map(o => `
        <div class="order-card ready">
          <div class="order-customer">${o.customerName}</div>
        </div>
      `).join('');
    });

    socket.on('announce_order', (order) => {
      triggerAnnouncement(order);
    });
  </script>
</body>
</html>
